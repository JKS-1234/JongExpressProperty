    <style>
        :root {
            --primary: #1a365d;
            --secondary: #d69e2e;
            --light: #f7fafc;
            --dark: #2d3748;
        }
        * {
            margin: 0;
            padding: 0;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--secondary);
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }
        nav a:hover {
            color: var(--secondary);
        }
        .hero {
            background: linear-gradient(rgba(26, 54, 93, 0.8), rgba(26, 54, 93, 0.8)), url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;

        }

            padding: 12px 30px;

            font-weight: bold;
            border-radius: 5px;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #ecc94b;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 50px 5%;
            gap: 30px;
        }
        .feature-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 250px;
            max-width: 350px;
            text-align: center;
        }
        .feature-card h3 {

            padding: 20px;
            margin-top: 20px;
        }

            text-decoration: none;

        }
        .property-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
