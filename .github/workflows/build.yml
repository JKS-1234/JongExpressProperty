name: Build property pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 20 * * *'   # daily at 20:00 UTC (~04:00 MYT) so listings refresh even with no code pushes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild property pages, sitemap, and data"
          file_pattern: "properties/** data/** sitemap.xml robots.txt"
