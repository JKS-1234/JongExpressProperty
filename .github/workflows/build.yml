name: Build property pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 20 * * *'   # daily at 20:00 UTC (~04:00 MYT) so listings refresh even with no code pushes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Regenerate pages from committed data
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python build.py --offline
          python tests/validate_site.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild property pages, sitemap, and data"
          file_pattern: "property area type listings PageListing semi-detached.html index.html faq.html sitemap.xml robots.txt zh i18n"
          add_options: "-A"
