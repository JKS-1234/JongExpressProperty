name: Daily Property Sync

on:
  schedule:
    # Runs automatically every day at midnight (Malaysia Time / 16:00 UTC)
    - cron: '0 16 * * *'
  push:
    branches: [ main ]
    paths:
      - 'build.py'
  workflow_dispatch: # This adds a manual "Run workflow" button in GitHub!

concurrency:
  group: daily-property-sync
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Website Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Latest Google Sheet Data
        run: python build.py

      # Commits made with GITHUB_TOKEN do not trigger new workflow runs, and the
      # push trigger only fires for build.py changes, so this cannot loop.
      - name: Save and Publish to Website
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Daily Sync: Updated Property Listings"
          branch: main
          file_pattern: "property js sitemap.xml robots.txt llms.txt listings index.html"
          add_options: "-A"
