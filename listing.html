<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Listings | Jong Express Property</title>
    <link rel="icon" type="image/png" href="photos/icononly.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo" style="text-decoration:none;">Jong Express Property</a>
        <nav>
            <a href="index.html#about">Our Promise</a>
            <a href="listing.html" style="color: var(--secondary);">Listings</a>
            <a href="index.html#contact">Contact Jong</a>
        </nav>
    </header>

    <section id="properties" class="featured-properties" style="padding-top:40px;">
        <h2>Featured Honest Listings</h2>
        <p style="margin-bottom: 30px;">100% Verified. We show you the good, and we don't hide the bad.</p>
        
        <div class="search-filter-wrapper">
            <div class="market-tabs">
                <button class="tab-btn active" onclick="setMarket('all', this)">All Listings</button>
                <button class="tab-btn" onclick="setMarket('subsale', this)">Sub-Sale & Rent</button>
                <button class="tab-btn" onclick="setMarket('project', this)">Developer Projects</button>
            </div>
            
            <input type="text" id="searchBar" class="search-input" placeholder="🔍 Type keywords... (e.g. Corner, Furnished, Pujut, Curtin)" onkeyup="resetAndFilter()">
            
            <div class="filter-container">
                <select id="statusFilter" class="filter-select" onchange="resetAndFilter()">
                    <option value="all">All Status</option>
                    <option value="sale">For Sale</option>
                    <option value="rent">For Rent</option>
                </select>
                <select id="typeFilter" class="filter-select" onchange="resetAndFilter()">
                    <option value="all">All Types</option>
                </select>
                <select id="areaFilter" class="filter-select" onchange="resetAndFilter()">
                    <option value="all">All Areas</option>
                </select>
            </div>
        </div>

        <div class="property-grid">
            <h3 style="text-align:center; width:100%; color:var(--primary);">Loading latest listings from our database...</h3>
        </div>
        <button id="loadMoreBtn" class="load-more-btn" onclick="showMoreListings()">Load More Listings</button>
    </section>

    <!-- LIGHTBOX POP-UP HTML -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</span>
        <span class="lightbox-next" onclick="changeLightboxImage(1)">&#10095;</span>
        <img id="lightbox-img" class="lightbox-content" src="">
    </div>

    <footer style="margin-top: 50px;">
        <p>&copy; 2026 Jong Express Property. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
