<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties | Jong Express Property</title>
    <link rel="icon" type="image/png" href="photos/icononly.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">Jong Express Property</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="listing.html" style="color: var(--secondary);">Listings & FB Updates</a>
        </nav>
    </header>

    <section id="properties" class="featured-properties">
        <h2>Featured Honest Listings</h2>
        <div class="search-filter-wrapper">
            <div class="market-tabs">
                <button class="tab-btn active" onclick="setMarket('all', this)">All Listings</button>
                <button class="tab-btn" onclick="setMarket('subsale', this)">Sub-Sale & Rent</button>
                <button class="tab-btn" onclick="setMarket('project', this)">Developer Projects</button>
            </div>
            <input type="text" id="searchBar" class="search-input" placeholder="🔍 Type keywords..." onkeyup="resetAndFilter()">
            <div class="filter-container">
                <select id="statusFilter" class="filter-select" onchange="resetAndFilter()"><option value="all">All Status</option><option value="sale">For Sale</option><option value="rent">For Rent</option></select>
                <select id="typeFilter" class="filter-select" onchange="resetAndFilter()"><option value="all">All Types</option></select>
                <select id="areaFilter" class="filter-select" onchange="resetAndFilter()"><option value="all">All Areas</option></select>
            </div>
        </div>

        <div class="property-grid">
            <h3 style="text-align:center; width:100%; color:var(--primary);">Loading latest listings...</h3>
        </div>
        <button id="loadMoreBtn" class="load-more-btn" onclick="showMoreListings()">Load More Listings</button>
    </section>

    <section style="margin: 50px auto; max-width: 1000px; padding: 20px; text-align: center;">
        <h2>Our Latest Properties on Facebook</h2>
        <script src="https://elfsightcdn.com/platform.js" async></script>
        <div class="elfsight-app-8cfc3004-89f9-4754-9047-e12cd7216640" data-elfsight-app-lazy></div>
    </section>

    <!-- HIDDEN LIGHTBOX FOR IMAGE PREVIEW -->
    <div id="lightbox" class="lightbox" onclick="closePreview()">
        <span class="lightbox-close" onclick="closePreview()">&times;</span>
        <img id="lightbox-img" class="lightbox-content" src="">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
